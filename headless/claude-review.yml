# Take-home for exercise 10: the same gate in GitHub Actions.
# Copy this file to .github/workflows/claude-review.yml in a repository of
# your own. It needs one secret: CLAUDE_CODE_OAUTH_TOKEN (run
# `claude setup-token` on your laptop; it uses your subscription), or
# ANTHROPIC_API_KEY if your team has an API key.
name: Claude review
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  review:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write, id-token: write }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.base_ref }}   # read the rules from the base branch, not the PR
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: >-
            Review the changes in pull request
            ${{ github.repository }}#${{ github.event.pull_request.number }}
            against the rules in headless/team-rules.md. Comment on every
            line that breaks a rule. Say "pass" if nothing does.
          claude_args: "--max-turns 8"
