# Appendix of exercise 5: the same quality gate on every pull request.
# Copy this file to .github/workflows/claude-review.yml in a repository of
# your own that also holds the headless folder (gate.py with your schema
# and rules, and team-rules.md).
#
# It needs one secret: CLAUDE_CODE_OAUTH_TOKEN. Run `claude setup-token` on
# your laptop; it prints a token for your Claude subscription. The token is
# tied to you, so use it for a repository of your own. Do not also set
# ANTHROPIC_API_KEY: when both exist, Claude Code uses the API key.
#
# With an API key instead, as on the slides: name the secret
# ANTHROPIC_API_KEY, pass it in the env block below, and change
# "--safe-mode" to "--bare" in headless/gate.py. --bare does not read a
# subscription token.
#
# The gate reviews the last commit. On a pull request that is the merge
# commit, so the gate sees everything the pull request changes. That is why
# the checkout fetches two commits.
#
# The rules file comes from the pull request itself, so a pull request can
# change the rules it is checked against. For pull requests from people you
# do not know, read headless/team-rules.md from the branch you merge into.
name: Claude review
on:
  pull_request:
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Install uv and Claude Code
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run the gate
        run: uv run headless/gate.py
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
